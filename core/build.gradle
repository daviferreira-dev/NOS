[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Verifica o movimento em uma JVM comum, sem abrir janela nem inicializar OpenGL.
tasks.register('movementChecks', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.nos.world.MovementChecks'
  args rootProject.file('assets/levels/m1.json').absolutePath
}
test.dependsOn movementChecks
// As verificações atuais são executadas por movementChecks; JUnit ainda não foi adicionado.
test.failOnNoDiscoveredTests = false
